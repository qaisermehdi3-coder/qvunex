[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qvunex"
version = "0.2.1"
description = "Measure what your AI inference actually costs. Local only, no dependencies."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Apache-2.0"}
authors = [{name = "Kaisar Mehdi"}]
keywords = ["inference", "gpu", "cost", "finops", "observability", "cpki"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Monitoring",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
qvunex = "qvunex.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
